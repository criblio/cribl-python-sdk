[project]
name = "cribl-python-sdk"
version = "0.0.1a1"
description = "Python SDK for the Cribl Control Plane API"
readme = "README-PYPI.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
http2 = ["h2>=4.0"]

[tool.poetry]
repository = "https://github.com/criblio/cribl-python-sdk.git"
packages = [
    {include = "cribl_python_sdk", from = "src"}
]
include = ["py.typed", "src/cribl_python_sdk/py.typed"]

[tool.setuptools.package-data]
"*" = ["py.typed", "src/cribl_python_sdk/py.typed"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.0",
    "respx>=0.20",
    "pyright>=1.1",
    "mypy>=1.10",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests requiring a live Cribl instance (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration' --cov=cribl_python_sdk --cov-report=term-missing"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.mypy]
strict = true
packages = ["cribl_python_sdk"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
